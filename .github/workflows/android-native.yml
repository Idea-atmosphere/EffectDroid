name: Android (native arm64 port)

# EffectDroid Native: retargets EffectCraft's Linux arm64 build to aarch64-linux-android
# (Bionic) with cargo-ndk —
#   * always: effectcraft-cli (headless render / MCP) as an arm64 Android binary
#   * on dispatch with build_gui: libeffectcraft_android.so (eframe GUI) + the :nativeapp APK
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'EffectCraft release tag to build from'
        type: string
        default: 'v0.17.0'
      build_gui:
        description: 'Also build the native GUI .so and the :nativeapp APK (experimental)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/build-native.sh'
      - 'android/nativeapp/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build-native.sh'
      - 'android/nativeapp/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  EFFECTCRAFT_REF: ${{ inputs.ref || 'v0.17.0' }}
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  build:
    name: cargo-ndk aarch64-linux-android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust (stable, Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache (upstream workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.upstream/effectcraft -> target'

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build effectcraft-cli for Android arm64
        run: scripts/build-native.sh cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-cli-android-arm64
          path: artifacts/effectcraft-cli-*-android-arm64.tar.gz
          if-no-files-found: error

      - name: Build the native GUI (libeffectcraft_android.so)
        if: github.event_name == 'workflow_dispatch' && inputs.build_gui
        run: scripts/build-native.sh gui

      - name: Assemble the native APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_gui
        run: scripts/build-native.sh apk

      - name: Upload native APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_gui
        uses: actions/upload-artifact@v4
        with:
          name: effectdroid-native-apk
          path: artifacts/effectdroid-native-*.apk
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "### EffectCraft → aarch64-linux-android"
            echo "- ref: \`$EFFECTCRAFT_REF\`"
            echo "- CLI: built + uploaded (Termux / adb)"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_gui }}" = "true" ]; then
              echo "- GUI + APK: attempted (experimental — see docs/ANDROID.md)"
            else
              echo "- GUI + APK: skipped (dispatch with build_gui to enable)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
