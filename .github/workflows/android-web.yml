name: Android (web port)

# EffectDroid Web APK: fetches EffectCraft's official web build (effectcraft-web-<ref>.zip
# from the upstream release) and assembles the WebView shell around it. No Rust toolchain
# needed — upstream ships the wasm build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'EffectCraft release tag to bundle'
        type: string
        default: 'v0.17.0'

permissions:
  contents: read

concurrency:
  group: android-web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Build WebView APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag builds attach the APK to the matching release
    env:
      EFFECTCRAFT_REF: ${{ inputs.ref || 'v0.17.0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve EffectCraft ref (tag builds follow the tag)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "EFFECTCRAFT_REF=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Fetch EffectCraft web assets
        shell: bash
        run: scripts/fetch-web-assets.sh "$EFFECTCRAFT_REF"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (uses the checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-key signed, sideloadable)
        working-directory: android
        env:
          VERSION_NAME: ${{ env.EFFECTCRAFT_REF }}
        # tee + annotations: raw run logs live on a host some environments can't reach, so
        # the key failure lines are surfaced as annotations (readable through the Checks API).
        shell: bash
        run: |
          if ! ./gradlew --no-daemon :webapp:assembleRelease 2>&1 | tee gradle.log; then
            echo "::error::Gradle build failed — key lines:"
            { grep -E "^e: |error: |FAILURE:|What went wrong|Execution failed|Could not |A problem occurred|BUILD FAILED|Exception in thread|Launcher failed|Downloading" gradle.log \
                || true; } | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done || true
            exit 1
          fi

      - name: Name the artifact
        shell: bash
        run: |
          # -print -quit (no pipe): with pipefail a `find | head` can die on SIGPIPE.
          apk="$(find android/webapp/build/outputs/apk -name '*.apk' -type f -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease reported success but produced no APK — outputs tree:"
            { find android/webapp/build/outputs -type f 2>/dev/null || true; } | head -n 15 \
              | while IFS= read -r f; do echo "::error::  $f"; done || true
            echo "::error::gradle.log tail:"
            { tail -n 25 android/gradle.log 2>/dev/null || true; } \
              | while IFS= read -r l; do echo "::error::$l"; done || true
            exit 1
          fi
          out="effectdroid-web-${EFFECTCRAFT_REF#v}.apk"
          cp "$apk" "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: effectdroid-web-${{ env.EFFECTCRAFT_REF }}
          path: effectdroid-web-*.apk
          if-no-files-found: error

      - name: Attach APK to the release (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "EffectDroid $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$APK" -R "$GITHUB_REPOSITORY" --clobber
