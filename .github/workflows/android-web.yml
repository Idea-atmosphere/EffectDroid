name: Android (web port)

# EffectDroid Web APK: builds EffectCraft's web (wasm) site from the pinned upstream
# release with EffectDroid's mobile patches (patches/*.patch), stages it into the webapp
# assets and assembles the WebView shell. scripts/fetch-web-assets.sh (stock release zip,
# no patches) remains available for environments without a Rust toolchain.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'EffectCraft release tag to bundle'
        type: string
        default: 'v0.17.0'

permissions:
  contents: read

concurrency:
  group: android-web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Build WebView APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag builds attach the APK to the matching release
    env:
      EFFECTCRAFT_REF: ${{ inputs.ref || 'v0.17.0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve EffectCraft ref (tag builds follow the tag)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "EFFECTCRAFT_REF=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Set up Rust (stable, wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache (upstream web workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.upstream/effectcraft-web -> target'

      # Must equal the wasm-bindgen version in the upstream Cargo.lock (0.2.129 at
      # v0.17.0, docs/web.md); build-web.sh fails with the exact need if they drift.
      - name: Install wasm-bindgen CLI (lockfile-pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      # cargo xtask web runs wasm-opt when found (any recent binaryen per docs/web.md).
      - name: Install wasm-opt (binaryen)
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      # tee + annotations: raw run logs live on a host some environments can't reach, so
      # the key failure lines are surfaced as annotations (readable through the Checks API).
      - name: Build the EffectCraft web bundle (source + mobile patches)
        shell: bash
        run: |
          if ! scripts/build-web.sh 2>&1 | tee build-web.log; then
            echo "::error::web bundle build failed — key lines:"
            { grep -E "error(\[[A-Z0-9]+\])?: |^error: |--> |panicked at|does not apply|not produced|No such file|could not compile|failed to select" build-web.log \
                || true; } | head -n 4 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::LOG TAIL build-web.log: $( { tail -n 25 build-web.log 2>/dev/null || true; } | tr '\n' '|' )"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (uses the checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-key signed, sideloadable)
        working-directory: android
        env:
          VERSION_NAME: ${{ env.EFFECTCRAFT_REF }}
        # tee + annotations: raw run logs live on a host some environments can't reach, so
        # the key failure lines are surfaced as annotations (readable through the Checks API).
        shell: bash
        run: |
          if ! ./gradlew --no-daemon :webapp:assembleRelease 2>&1 | tee gradle.log; then
            echo "::error::Gradle build failed — key lines:"
            { grep -E "^e: |error: |FAILURE:|What went wrong|Execution failed|Could not |A problem occurred|BUILD FAILED|Exception in thread|Launcher failed|Downloading" gradle.log \
                || true; } | head -n 4 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::LOG TAIL gradle.log: $( { tail -n 25 gradle.log 2>/dev/null || true; } | tr '\n' '|' )"
            exit 1
          fi

      - name: Name the artifact
        shell: bash
        run: |
          # -print -quit (no pipe): with pipefail a `find | head` can die on SIGPIPE.
          apk="$(find android/webapp/build/outputs/apk -name '*.apk' -type f -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease reported success but produced no APK — outputs tree:"
            { find android/webapp/build/outputs -type f 2>/dev/null || true; } | head -n 15 \
              | while IFS= read -r f; do echo "::error::  $f"; done || true
            echo "::error::LOG TAIL android/gradle.log: $( { tail -n 25 android/gradle.log 2>/dev/null || true; } | tr '\n' '|' )"
            exit 1
          fi
          out="effectdroid-web-${EFFECTCRAFT_REF#v}.apk"
          cp "$apk" "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: effectdroid-web-${{ env.EFFECTCRAFT_REF }}
          path: effectdroid-web-*.apk
          if-no-files-found: error

      - name: Attach APK to the release (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "EffectDroid $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$APK" -R "$GITHUB_REPOSITORY" --clobber
